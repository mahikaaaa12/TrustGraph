version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: trustgraph-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: trustgraph
    volumes:
      - mongo_data:/data/db
    networks:
      - trustgraph-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustgraph-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/trustgraph
      JWT_SECRET: production_super_secret_jwt_key_at_least_32_characters_long
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:80,http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - trustgraph-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trustgraph-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trustgraph-net

networks:
  trustgraph-net:
    driver: bridge

volumes:
  mongo_data:
