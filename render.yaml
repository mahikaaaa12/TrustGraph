services:
  # 1. Backend Web Service
  - type: web
    name: trustgraph-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://trustgraph-client.onrender.com

  # 2. Frontend Static Site with SPA Rewrite Rules
  - type: static
    name: trustgraph-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA Rewrite: Rewrites all non-file route paths to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://trustgraph-api.onrender.com/api/v1
